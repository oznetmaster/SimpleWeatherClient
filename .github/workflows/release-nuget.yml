name: Release NuGet Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version or tag to publish, for example 1.2.3 or v1.2.3
        required: true
        type: string
      skip_hardware_checks:
        description: Publish without hardware validation when the processor or local runner is unavailable
        required: false
        type: boolean
        default: false
      hardware_skip_reason:
        description: Reason for skipping hardware checks (required when selected)
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: write

jobs:
  pack-and-publish:
    runs-on: windows-latest
    env:
      PROJECT_PATH: .\SimpleWeather\SimpleWeather.csproj
      ARTIFACT_DIR: ${{ github.workspace }}\artifacts

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify configured release checks
        shell: pwsh
        working-directory: ${{ github.workspace }}/.
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_RELEASE_CHECKS: ${{ vars.RELEASE_REQUIRED_CHECKS }}
          REQUIRED_HOSTED_WORKFLOWS: '["tests.yml"]'
          RELEASE_SKIP_HARDWARE_CHECKS: ${{ inputs.skip_hardware_checks }}
          RELEASE_HARDWARE_SKIP_REASON: ${{ inputs.hardware_skip_reason }}
        run: '& ./.github/scripts/Wait-RequiredReleaseChecks.ps1'
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Determine package version
        id: version
        shell: pwsh
        run: |
          $rawVersion = switch ('${{ github.event_name }}') {
              'workflow_dispatch' { '${{ inputs.version }}'; break }
              'push' { '${{ github.ref_name }}'; break }
              default { '' }
          }
          if ([string]::IsNullOrWhiteSpace($rawVersion)) {
              throw 'No release tag or manual version was provided.'
          }

          $packageVersion = $rawVersion.Trim()
          if ($packageVersion.StartsWith('v', [System.StringComparison]::OrdinalIgnoreCase)) {
              $packageVersion = $packageVersion.Substring(1)
          }

          if ($packageVersion -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z\.-]+)?$') {
              throw "Version '$packageVersion' is not a supported NuGet semantic version."
          }

          "raw_version=$rawVersion" >> $env:GITHUB_OUTPUT
          "package_version=$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Check release notes
        shell: pwsh
        run: |
          $notesPath = "docs/release-notes/v${{ steps.version.outputs.package_version }}.md"
          if (!(Test-Path -LiteralPath $notesPath)) { throw "Missing release notes: $notesPath" }

      - name: Restore
        run: dotnet restore .\SimpleWeather.Tests\SimpleWeather.Tests.csproj

      - name: Build Release
        run: dotnet build .\SimpleWeather.Tests\SimpleWeather.Tests.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:Version=${{ steps.version.outputs.package_version }}

      - name: Test offline before packaging
        run: dotnet test .\SimpleWeather.Tests\SimpleWeather.Tests.csproj -c Release --no-build --settings .\SimpleWeather.Tests\unit.runsettings

      - name: Pack SimpleWeatherClient
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "${{ env.ARTIFACT_DIR }}" -Force | Out-Null
          dotnet pack ${{ env.PROJECT_PATH }} -c Release --no-build -o "${{ env.ARTIFACT_DIR }}" /p:ContinuousIntegrationBuild=true /p:Version=${{ steps.version.outputs.package_version }} /p:PackageVersion=${{ steps.version.outputs.package_version }}

      - name: Publish package to NuGet
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path "${{ env.ARTIFACT_DIR }}" -Filter '*.nupkg' | Where-Object { $_.Name -notlike '*.symbols.nupkg' }
          if (-not $packages) {
              throw 'No NuGet package was produced.'
          }

          foreach ($package in $packages) {
              dotnet nuget push $package.FullName --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
              if ($LASTEXITCODE -ne 0) { throw "NuGet publication failed." }
          }

      - name: Publish symbol package to NuGet
        shell: pwsh
        run: |
          $packages = Get-ChildItem -Path "${{ env.ARTIFACT_DIR }}" -Filter '*.snupkg'
          if (-not $packages) {
              throw 'No symbol package was produced.'
          }

          foreach ($package in $packages) {
              dotnet nuget push $package.FullName --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
              if ($LASTEXITCODE -ne 0) { throw "NuGet publication failed." }
          }

      - name: Create GitHub release from tag
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.raw_version }}
          name: ${{ steps.version.outputs.raw_version }}
          body_path: docs/release-notes/v${{ steps.version.outputs.package_version }}.md
          prerelease: ${{ contains(steps.version.outputs.package_version, '-') }}
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
