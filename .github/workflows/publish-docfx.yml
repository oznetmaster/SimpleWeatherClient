name: Publish DocFX Site
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-docs:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x

          '
    - name: Setup Pages
      uses: actions/configure-pages@v5
    - name: Build and verify standard documentation
      uses: oznetmaster/BuildAutomation@c0a215e202dc1e05a37707720ab12032be610518
      with:
        task: documentation
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: .\docfx-site
  deploy-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
'on':
  push:
    branches:
    - main
    paths:
    - SimpleWeather/**
    - docfx/**
    - .github/workflows/publish-docfx.yml
    - build/**
    - .config/dotnet-tools.json
  workflow_dispatch: null
