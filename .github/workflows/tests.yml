name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apps:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build library, console, desktop and widget
        run: dotnet build SimpleWeather.sln -c Release -p:Platform=x64

  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net472, net10.0]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run offline NUnit tests
        run: dotnet test SimpleWeather.Tests/SimpleWeather.Tests.csproj -c Release -f ${{ matrix.framework }} --settings SimpleWeather.Tests/unit.runsettings --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.framework }}
          path: TestResults/*.trx
